# ==============================================================================
# Vidhura AI — Production Docker Compose (Cloud VPS & Production Deployments)
# Uses pre-built images or build contexts with production profiles
# ==============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # MongoDB Database (Optional if using hosted MongoDB Atlas)
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: vidhura-mongodb
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.50"]
    environment:
      MONGO_INITDB_DATABASE: vidhura
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vidhura-net

  # ─────────────────────────────────────────────────────────────
  # Backend — Spring Boot 3 API (Java 17)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/dileepkumarsasanapuri/vidhura-backend:latest
    container_name: vidhura-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -XX:+UseG1GC}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/vidhura}
      VIDHURA_POLICY_STORAGE_ROOT: ${VIDHURA_POLICY_STORAGE_ROOT:-/app/data/policies}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - policy_data:/app/data/policies
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - vidhura-net

  # ─────────────────────────────────────────────────────────────
  # Frontend — Next.js 15 Application (Standalone)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: ghcr.io/dileepkumarsasanapuri/vidhura-frontend:latest
    container_name: vidhura-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - vidhura-net

  # ─────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy with Rate Limiting & SSL
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vidhura-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vidhura-net

volumes:
  mongodb_data:
    driver: local
  policy_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  certbot_www:
    driver: local

networks:
  vidhura-net:
    driver: bridge
