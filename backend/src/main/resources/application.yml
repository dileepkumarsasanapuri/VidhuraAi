server:
  port: 5000
  servlet:
    context-path: /

spring:
  application:
    name: vidhura-ai-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://dileepkumarsasanapuri_db_user:Dileep123@cluster0.r0i7een.mongodb.net/vidhura?retryWrites=true&w=majority&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  config:
    import: optional:file:../.env[.properties]

jwt:
  secret: ${JWT_SECRET:vidhura_secret_key_change_in_production_min_32_bytes}
  expiration: 604800000 # 7 days in milliseconds

google:
  client-id: ${GOOGLE_CLIENT_ID:}

# AI Provider Configuration (Default: Groq - Free, Ultra-Fast Llama 3.3 70B)
ai:
  provider: ${AI_PROVIDER:auto}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-20b}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  hf:
    token: ${HF_TOKEN:}
    model: ${HF_MODEL:meta-llama/Llama-3.3-70B-Instruct}
    api-url: ${HF_API_URL:https://router.huggingface.co/v1/chat/completions}

# Backward compatibility bindings
hf:
  token: ${GROQ_API_KEY:${HF_TOKEN:}}
  model: ${GROQ_MODEL:${HF_MODEL:llama-3.3-70b-versatile}}
  api-url: ${GROQ_API_URL:${HF_API_URL:https://api.groq.com/openai/v1/chat/completions}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.vidhura.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"


