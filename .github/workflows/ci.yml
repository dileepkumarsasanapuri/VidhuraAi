name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend Quality Gate: Compile, Unit & Integration Tests, JAR
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Java 17 / Maven Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Compile Java Sources
        run: mvn clean test-compile -B

      - name: Execute Automated Test Suite
        run: mvn test -B
        env:
          GROQ_API_KEY: "ci-dummy-key"
          JWT_SECRET: "ci_jwt_secret_testing_minimum_32_bytes_long"
          MONGODB_URI: "mongodb://localhost:27017/test"

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Package Production JAR
        run: mvn package -DskipTests -B

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidhura-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Frontend Quality Gate: Lint, TypeScript Check, Next.js Build
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Next.js Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Linter
        run: npm run lint

      - name: Validate Production Build & TypeScript Types
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""

  # ─────────────────────────────────────────────────────────────
  # Security Gate: Vulnerability Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0" # Audit mode; alerts without blocking PR
          ignore-unfixed: true
