name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
      - version-2
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
      - version-2
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend Quality Gate: Compile, Test Suite & Artifact Package
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Java 17 / Maven Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Validate Dependencies Resolution
        run: mvn dependency:resolve -B

      - name: Compile Java Sources
        run: mvn clean test-compile -B

      - name: Execute Automated Test Suite
        run: mvn test -B
        env:
          GROQ_API_KEY: "ci-dummy-key"
          JWT_SECRET: "ci_jwt_secret_testing_minimum_32_bytes_long"
          MONGODB_URI: "mongodb://localhost:27017/test"
          VIDHURA_POLICY_STORAGE_ROOT: "/tmp/vidhura-policies"

      - name: Publish Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Package Production JAR
        run: mvn package -DskipTests -B

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidhura-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Frontend Quality Gate: TypeCheck, Lint & Next.js Build
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Node 20 / TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies Deterministically
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Next.js Linter
        run: npm run lint

      - name: Execute Frontend Automated Tests
        run: npm test

      - name: Compile Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
          NEXT_TELEMETRY_DISABLED: "1"

  # ─────────────────────────────────────────────────────────────
  # Security Gate: Secret Scanning & Vulnerability Checks
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # Docker Gate: Container Build Verification (No Push)
  # ─────────────────────────────────────────────────────────────
  docker-validation:
    name: Docker — Container Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Verification Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vidhura-backend:ci-test

      - name: Build Frontend Docker Image (Verification Only)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vidhura-frontend:ci-test
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=

  # ─────────────────────────────────────────────────────────────
  # CI Summary: Release Verification Gate
  # ─────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Verification Summary
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-audit, docker-validation]
    if: always()

    steps:
      - name: Report Status
        run: |
          echo "=========================================================="
          echo "Vidhura AI CI Quality Gate Evaluation"
          echo "Backend Validation:     ${{ needs.backend-ci.result }}"
          echo "Frontend Validation:    ${{ needs.frontend-ci.result }}"
          echo "Security Audit:         ${{ needs.security-audit.result }}"
          echo "Docker Image Builds:    ${{ needs.docker-validation.result }}"
          echo "=========================================================="
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ] || [ "${{ needs.docker-validation.result }}" != "success" ]; then
            echo "CI Quality Gate FAILED. One or more core stages failed."
            exit 1
          fi
          echo "All Core Quality Gates PASSED."
