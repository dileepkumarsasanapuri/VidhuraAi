name: Continuous Delivery & Deployment (CD)

# ─────────────────────────────────────────────────────────────
# CD Safety Rule: Deployment is strictly decoupled from CI.
# Automatic deployment to main is disabled.
# Production releases require explicit release authorization.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      release_tag:
        description: "Semantic Version Tag (e.g., v2.0.0)"
        required: true
        default: "v2.0.0"
      authorization_code:
        description: "Explicit Authorization Confirmation (Type 'RELEASE_AUTHORIZED' to proceed)"
        required: true
        default: ""

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # Release Gate: Validate Explicit Authorization
  # ─────────────────────────────────────────────────────────────
  authorization-gate:
    name: Release Authorization Verification
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Authorization
        run: |
          echo "=========================================================="
          echo "Evaluating Release Authorization Boundary"
          echo "Trigger Event: ${{ github.event_name }}"
          echo "Ref:           ${{ github.ref }}"
          echo "=========================================================="
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.authorization_code }}" != "RELEASE_AUTHORIZED" ]; then
              echo "❌ Release authorization failed. Input confirmation code was '${{ github.event.inputs.authorization_code }}'."
              echo "To trigger CD, you must explicitly provide confirmation code: RELEASE_AUTHORIZED"
              exit 1
            fi
            echo "✅ Explicit manual authorization confirmed for environment: ${{ github.event.inputs.target_environment }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "✅ Git semantic version release tag detected: ${{ github.ref }}"
          fi

  # ─────────────────────────────────────────────────────────────
  # Stage 1: Build & Publish OCI Container Images to Registry
  # ─────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build & Publish Authorized Container Images
    needs: [authorization-gate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_environment || 'production' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.release_tag || 'latest' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.release_tag || 'latest' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & Publish Vidhura Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Publish Vidhura Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Authorized Deployment Execution
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.target_environment || 'production' }}
    needs: [authorization-gate, build-and-publish]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Connecting to $DEPLOY_HOST..."
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            cd /opt/vidhura-ai && \
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
            docker image prune -af --filter 'until=48h'
          "

      - name: Simulated Deployment Summary (No SSH Host Configured)
        if: env.DEPLOY_HOST == ''
        run: |
          echo "=========================================================="
          echo "DEPLOY_HOST secret not configured."
          echo "Authorized images successfully pushed to registry."
          echo "Environment target: ${{ github.event.inputs.target_environment || 'production' }}"
          echo "=========================================================="

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Post-Deployment Synthetic Health Check
  # ─────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-Deployment Synthetic Health Check
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Run Synthetic Health Check
        run: |
          TARGET_URL="${{ secrets.DEPLOY_URL || '' }}"
          if [ -n "$TARGET_URL" ]; then
            echo "Probing application health endpoint: $TARGET_URL/api/health"
            for i in {1..10}; do
              RESPONSE=$(curl -s -w "\n%{http_code}" "$TARGET_URL/api/health" || true)
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | sed '$d')
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check PASSED on attempt $i. Response: $BODY"
                exit 0
              fi
              echo "Attempt $i: Received HTTP $HTTP_CODE. Retrying in 10 seconds..."
              sleep 10
            done
            echo "❌ Post-deployment health check failed after 10 attempts."
            exit 1
          else
            echo "ℹ️ DEPLOY_URL not set. Skipping live HTTP probe in sandbox environment."
          fi
